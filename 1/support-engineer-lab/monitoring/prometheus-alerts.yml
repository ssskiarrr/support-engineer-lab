groups:
  - name: support-lab
    rules:
      - alert: HighHttp5xxRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Elevated HTTP 5xx rate"

      - alert: ServiceUnavailable
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service is unavailable"
